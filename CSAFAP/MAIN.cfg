// =================== Crosshair & Viewmodel ================================
// ⚠️ Requirement for crosshair section: INSERT your crosshair and viewmodel settings here ▼
alias reset_crosshair "cl_crosshairstyle 4; cl_crosshairsize 1; cl_crosshairthickness 1; cl_crosshairgap -4; cl_crosshair_drawoutline 0; cl_crosshairdot 0; cl_crosshair_t 0; cl_crosshairusealpha 1; cl_crosshairalpha 255; cl_crosshair_recoil 0; cl_crosshairgap_useweaponvalue 0; cl_crosshaircolor 0; cl_crosshair_sniper_width 1"
alias reset_viewmodel "viewmodel_presetpos 2"















