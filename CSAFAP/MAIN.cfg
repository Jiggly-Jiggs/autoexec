// =================== LAST GUN QUICKSWITCH OVERRIDE ===================

alias lastgun "to_primary"

alias to_primary   "slot1; switchhandsright; alias lastgun to_primary; current_color"
alias to_secondary "slot2; switchhandsright; alias lastgun to_secondary; current_color"
alias to_knife     "slot3; switchhandsleft; current_color"

bind 1 "to_primary"
bind 2 "to_secondary"
bind 3 "to_knife"

bind 5 "slot5; switchhandsright; current_color"
bind c "slot6; switchhandsright; current_color"
bind z "slot7; switchhandsright; current_color"
bind x "slot8; switchhandsright; current_color"
bind 4 "slot9; slot12; switchhandsright; current_color"
bind v "slot10; switchhandsright; current_color"

alias +qsw "to_knife"
alias -qsw "lastgun"
bind mouse5 "+qsw"
cl_scoreboard_mouse_enable_binding "+attack2"

// Crouchjump: bind <key> +CrouchJump
alias duck_end "duck -9999 f u"

alias +HoldDuck "+duck; alias duck_end"
alias -HoldDuck "duck -9999 f u; alias duck_end duck -9999 f u"

alias +CrouchJump alias CJ! CJ+; alias -CrouchJump alias CJ! CJ-; alias CJ! ""
alias CJ+ "M1>; alias CJ! CJ++"
alias CJ++ "M2>; alias CJ! CJ+++"
alias CJ+++ "+duck; alias CJ! CJ++++"
alias CJ++++ "+jump; alias CJ!"
alias CJ- "duck_end; alias CJ! CJ--"
alias CJ-- "alias CJ!; jump -9999 f u"